name: Build patched inkOS

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'inkOS release to patch (v0.6 or later), or "latest"'
        required: true
        default: latest
      force:
        description: Rebuild even if this release was already built
        type: boolean
        default: false
      test:
        description: 'Test build: a name like "test1" publishes pre-release <version>-patched-<name> (release + debug APK) and skips the app hub. Leave empty for a normal build.'
        required: false
        default: ''
  schedule:
    # Daily check for a new upstream release (09:00 UTC). Builds only when there is one.
    - cron: '0 9 * * *'

permissions:
  contents: write

concurrency:
  group: build-patched-inkos
  cancel-in-progress: false

env:
  UPSTREAM: gezimos/inkOS
  MIN_RELEASE: v0.6
  HUB: fabiantorrestech/android-apps
  HUB_KEY: PERSONAL

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Resolve release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ github.event.inputs.release || 'latest' }}
          INPUT_FORCE: ${{ github.event.inputs.force || 'false' }}
          INPUT_TEST: ${{ github.event.inputs.test || '' }}
        run: |
          set -euo pipefail
          LATEST="$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)"
          if [ "$INPUT_RELEASE" = "latest" ]; then
            TAG="$LATEST"
          else
            TAG="$INPUT_RELEASE"
          fi

          if ! [[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::'$TAG' is not a valid release name."
            exit 1
          fi
          # Version-aware compare: v0.6 < v0.10.
          if [ "$(printf '%s\n%s\n' "$MIN_RELEASE" "$TAG" | sort -V | head -1)" != "$MIN_RELEASE" ]; then
            echo "::error::The patch supports inkOS $MIN_RELEASE and later (asked for $TAG)."
            exit 1
          fi
          if ! gh release view "$TAG" -R "$UPSTREAM" > /dev/null 2>&1; then
            echo "::error::inkOS has no release '$TAG'. See https://github.com/$UPSTREAM/releases"
            exit 1
          fi

          OUT="${TAG}-patched"
          if [ -n "$INPUT_TEST" ]; then
            if ! [[ "$INPUT_TEST" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::'$INPUT_TEST' is not a valid test build name."
              exit 1
            fi
            OUT="${OUT}-${INPUT_TEST}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          # Test builds are pre-releases: never "latest" here, never sent to the app hub.
          if [ -n "$INPUT_TEST" ]; then echo "test=true" >> "$GITHUB_OUTPUT"; else echo "test=false" >> "$GITHUB_OUTPUT"; fi
          # Only the newest upstream release becomes "latest" here, so update apps never downgrade.
          if [ "$TAG" = "$LATEST" ] && [ -z "$INPUT_TEST" ]; then echo "latest=true" >> "$GITHUB_OUTPUT"; else echo "latest=false" >> "$GITHUB_OUTPUT"; fi

          if gh release view "$OUT" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 && [ "$INPUT_FORCE" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Release **$OUT** already exists. Nothing to do (run with *force* to rebuild)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Clone inkOS ${{ steps.rel.outputs.tag }}
        if: steps.rel.outputs.skip == 'false'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          # Full history so `git am -3` can find the blobs the patch was made against.
          git clone --quiet "https://github.com/$UPSTREAM.git" inkos
          git -C inkos checkout --quiet "refs/tags/$TAG"

      - name: Apply patches
        if: steps.rel.outputs.skip == 'false'
        working-directory: inkos
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          git config user.name "inkOS-Patcher builder"
          git config user.email "actions@users.noreply.github.com"
          # Every patches/*.patch, in name order. Each one is its own commit, so one failing
          # patch names itself in the summary.
          for patch in ../patches/*.patch; do
            name="$(basename "$patch" .patch)"
            if ! git am -3 "$patch"; then
              {
                echo "### The $name patch no longer applies to inkOS $TAG"
                echo "Conflicting files:"
                git diff --name-only --diff-filter=U | sed 's/^/- /'
                echo ""
                echo "Fix: run \`scripts/refresh-patch.sh <inkOS checkout> $TAG $name\` locally (see README), push, then run this workflow again."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "::error::The $name patch conflicts with inkOS $TAG. See the job summary."
              exit 1
            fi
          done

      - name: Set up JDK 17
        if: steps.rel.outputs.skip == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        if: steps.rel.outputs.skip == 'false'
        uses: gradle/actions/setup-gradle@v4

      # inkOS's own build.gradle.kts signs the release build from these env vars.
      - name: Build signed release APK
        if: steps.rel.outputs.skip == 'false'
        working-directory: inkos
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::SIGNING_KEY secret is missing."
            exit 1
          fi
          echo "$SIGNING_KEY" | base64 --decode > "$KEYSTORE_FILE"
          chmod +x gradlew
          ./gradlew assembleRelease assembleDebug

          # inkOS signs debug builds with the throwaway Gradle debug key. Re-sign with PERSONAL so the
          # hub's debug APK (app.inkos.debug) matches the release key, like every hub app (android-apps ADR 7).
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          debug_in="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          "$apksigner" sign --ks "$KEYSTORE_FILE" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/inkOS-debug.apk" "$debug_in"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      # Refuse to publish an APK signed with anything but the PERSONAL key the app hub expects,
      # so a wrong secret (or an unsigned build) can never ship an APK that won't install over the last one.
      - name: Check signing key
        if: steps.rel.outputs.skip == 'false'
        id: apk
        env:
          OUT: ${{ steps.rel.outputs.out }}
        run: |
          set -euo pipefail
          built="$(ls inkos/app/build/outputs/apk/release/*.apk | head -1)"
          debug="$RUNNER_TEMP/inkOS-debug.apk"
          expected="$(curl -fsSL "https://raw.githubusercontent.com/$HUB/main/apps.json" | jq -r ".keys.$HUB_KEY")"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          for apk in "$built" "$debug"; do
            actual="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: \([0-9a-f]*\).*/\1/p' | head -1)"
            if [ -z "$expected" ] || [ "$expected" = "null" ] || [ "$actual" != "$expected" ]; then
              echo "::error::$(basename "$apk") signer '$actual' does not match $HUB_KEY in $HUB/apps.json ($expected)."
              exit 1
            fi
            echo "$(basename "$apk") signed with $HUB_KEY ($actual)"
          done
          DEST="inkOS-${OUT}.apk"
          cp "$built" "$DEST"
          cp "$debug" inkOS-debug.apk
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "debug=inkOS-debug.apk" >> "$GITHUB_OUTPUT"
          # Test pre-releases also carry the debug APK, which installs next to the real launcher.
          if [ "${{ steps.rel.outputs.test }}" = "true" ]; then
            cp "$debug" "inkOS-debug-${OUT}.apk"
            printf 'files<<EOF\n%s\n%s\nEOF\n' "$DEST" "inkOS-debug-${OUT}.apk" >> "$GITHUB_OUTPUT"
          else
            printf 'files<<EOF\n%s\nEOF\n' "$DEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release notes
        if: steps.rel.outputs.skip == 'false'
        env:
          TAG: ${{ steps.rel.outputs.tag }}
          IS_TEST: ${{ steps.rel.outputs.test }}
        run: |
          {
            if [ "$IS_TEST" = "true" ]; then
              echo "**Test build** from branch \`$GITHUB_REF_NAME\` ($GITHUB_SHA). Not sent to the app hub."
              echo ""
            fi
            echo "inkOS $TAG with three patches:"
            echo ""
            echo "- App drawer toggle: Settings > App Drawer > **Enable App Drawer** (default On). Off makes"
            echo "  every gesture, key and shortcut that opens the drawer do nothing. Search still works."
            echo "- Hide until search: Settings > App Drawer > Search > **Show Apps** chooses when the app"
            echo "  drawer lists apps: Always (stock inkOS), While typing, or After Search key (default)."
            echo "  In After Search key mode the drawer stays empty until you type and press Search."
            echo "- Page indicator options: Settings > Home, under **Enable Page Indicator**: Side"
            echo "  (Auto / Left / Right), Auto-hide (Off / 1-10 s, fades out and back in), Fades To"
            echo "  (Nothing / 10-90%), Opacity (10-100%) and Style (Classic / Pill). Defaults match stock."
            echo ""
            echo "Upstream: https://github.com/$UPSTREAM/releases/tag/$TAG"
          } > release-notes.md

      - name: Publish release
        if: steps.rel.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.out }}
          name: inkOS ${{ steps.rel.outputs.out }}
          body_path: release-notes.md
          files: ${{ steps.apk.outputs.files }}
          make_latest: ${{ steps.rel.outputs.latest }}
          prerelease: ${{ steps.rel.outputs.test == 'true' }}
          target_commitish: ${{ github.sha }}

      # Same rolling-release step as the other apps' workflows (android-apps ADR 4 and 8).
      # Only the newest upstream release goes to the hub, so its download never goes backwards.
      - name: Publish to the app hub (fabiantorrestech/android-apps)
        if: steps.rel.outputs.skip == 'false' && steps.rel.outputs.latest == 'true'
        env:
          GH_TOKEN: ${{ secrets.APP_HUB_TOKEN }}
          TAG: inkos
          NAME: inkOS (patched)
          SRC: ${{ steps.apk.outputs.path }}
          DEBUG: ${{ steps.apk.outputs.debug }}
          OUT: ${{ steps.rel.outputs.out }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::APP_HUB_TOKEN missing: not publishing to the hub"
            exit 0
          fi
          cp "$SRC" inkOS.apk
          title="$NAME $OUT"
          notes="Built by CI from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}: inkOS ${OUT%-patched} with the app-drawer-toggle, hide-until-search and page-indicator-options patches, on $(date -u '+%Y-%m-%d %H:%M') UTC."
          if gh release view "$TAG" --repo "$HUB" > /dev/null 2>&1; then
            gh release upload "$TAG" inkOS.apk "$DEBUG" --repo "$HUB" --clobber
            gh release edit "$TAG" --repo "$HUB" --title "$title" --notes "$notes"
          else
            gh release create "$TAG" inkOS.apk "$DEBUG" --repo "$HUB" --target main --title "$title" --notes "$notes" --latest=false
          fi
